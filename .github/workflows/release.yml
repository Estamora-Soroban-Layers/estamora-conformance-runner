name: Release

# Publishing is gated on the tag matching what the repository says it is, because for a
# conformance tool the version is part of what a result means: the report names the
# runner version, and a published crate whose manifest disagrees with its tag would make
# every receipt issued from it uninterpretable.
#
# The tag produces a GitHub release with a binary for every supported platform, and
# those binaries are verified before they are attached. `cargo publish` is the one step
# this workflow does not take: a crates.io version cannot be withdrawn, so it stays a
# human command against a token. See the comment at the foot of this file.

on:
  push:
    # Three components, so that a major-version action tag -- `v1`, the ref a workflow
    # pins with `uses: ...@v1` -- does not start a release. This workflow asserts that
    # the tag equals the workspace version, and `v1` never will, so matching `v*` here
    # would make every move of the action tag a red release run. The specification
    # repository uses the same pattern for the same reason.
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the tag and the manifest
        id: versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the manifest is the one mistake that cannot be fixed
      # afterwards: the published crate keeps the version the manifest said.
      - name: The tag matches the workspace version
        shell: bash
        run: |
          test "${{ steps.versions.outputs.tag }}" = "${{ steps.versions.outputs.manifest }}" \
            || { echo "tag v${{ steps.versions.outputs.tag }} does not match the workspace version ${{ steps.versions.outputs.manifest }}"; exit 1; }

      - name: The changelog has an entry for it
        shell: bash
        run: |
          grep -q "^## \[${{ steps.versions.outputs.tag }}\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for ${{ steps.versions.outputs.tag }}"; exit 1; }

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting, lints and the full suite
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked

      # A crate's page on a registry is generated from its manifest, and the fields that
      # make that page useful -- the description, the README, the keywords, the categories --
      # are declared once in `[workspace.package]` and inherited. A crate that forgets to
      # inherit one is published without it, and nothing else would notice: the workspace
      # still has the value. So this reads what Cargo actually resolves, and it checks every
      # publishable crate without being given a list.
      - name: Every published crate carries the metadata a consumer needs
        run: cargo metadata --no-deps --format-version 1 | python3 scripts/check-crate-metadata.py

      # The package that gets published is the package that was tested. `--locked` keeps
      # the dependency tree exactly as committed, which is the whole reason the lock file
      # is in the repository.
      #
      # Packaging rewrites each path dependency into a registry dependency of the same
      # version, so it can only resolve once that version is on crates.io. On the first
      # release of a version nothing is, so a crate whose workspace dependency is not yet
      # published cannot be packaged — which is a fact about the order publishes happen
      # in, not a defect, and it is reported as such rather than failing the job. Any
      # other packaging failure still fails it.
      # The crates.io sequence is a comment at the end of this file, so it is prose, and
      # prose is checked by nothing. This reads it back and fails when it disagrees with
      # what Cargo resolves — including when a crate in it could not be packaged at all,
      # which is how `estamora-cli` came to be listed here as a command that cannot
      # finish. It is one place to edit and one check that reads it.
      - name: The publish sequence names crates that can be published
        run: cargo metadata --no-deps --format-version 1 | python3 scripts/check-publish-plan.py

      # The list is asked for rather than repeated, so the loop and the documented
      # sequence cannot disagree about which crates are published, and a crate that is
      # deliberately not published is not reported here as merely pending.
      - name: Package every publishable crate
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          mapfile -t crates < <(printf '%s' "$metadata" | python3 scripts/check-publish-plan.py --print-sequence)
          awaiting=0
          for crate in "${crates[@]}"; do
            if cargo package --locked -p "$crate" 2> /tmp/package.log; then
              echo "packaged $crate"
            elif grep -q 'no matching package named' /tmp/package.log; then
              echo "::notice::$crate cannot be packaged yet: a workspace dependency of this \
          version is not on crates.io. It becomes packageable once that crate is published, \
          which is the order the manual publish follows."
              awaiting=$((awaiting + 1))
            else
              cat /tmp/package.log
              exit 1
            fi
          done
          echo "$awaiting of ${#crates[@]} crate(s) await a dependency; the rest are packaged"

      - name: Upload the packaged crates
        uses: actions/upload-artifact@v7
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error

  # A binary is the difference between a tool somebody can run and a source tree they
  # have to build first, and building this one means compiling a Soroban host, a TLS
  # stack and their transitive tree. Before this job existed the only way to obtain
  # `estamora` was to check out the repository `install.sh` was standing in, which is
  # not an install path for a reviewer, a CI pipeline or anybody else without a clone.
  #
  # Every target is built on a runner of its own architecture rather than
  # cross-compiled, because a cross-compiled artefact is a different claim: nothing
  # executes it before it is published, and one of these dependencies builds native
  # code.
  binaries:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            experimental: false
          # arm64 Linux is the newest of these runner labels. A label that moved would
          # otherwise fail a release that has nothing wrong with it, so it is allowed to
          # come up empty rather than to block the three that will not.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            experimental: true
          - os: macos-latest
            target: aarch64-apple-darwin
            experimental: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `--locked` for the same reason the crate is packaged with it: the binary that
      # gets published is the one the committed dependency tree describes.
      - name: Build the release binary
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }} -p estamora-cli

      # One archive format for every platform. Windows ships `bsdtar` and Windows 10
      # onward extracts a `.tar.gz` without anything installed, so a second format
      # would be a second thing to keep right for no gain.
      - name: Package it with the licence and the version it reports
        shell: bash
        run: |
          set -euo pipefail
          name="estamora-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ -f "target/${{ matrix.target }}/release/estamora.exe" ]; then
            cp "target/${{ matrix.target }}/release/estamora.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/estamora" "dist/$name/"
          fi
          cp LICENSE README.md "dist/$name/"
          # The archive carries the version it reports, so that an installer and the
          # tool cannot disagree about what was installed.
          ./dist/$name/estamora --version >> "dist/$name/VERSION" \
            || ./dist/$name/estamora.exe --version >> "dist/$name/VERSION"
          tar -C dist -czf "$name.tar.gz" "$name"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: estamora-${{ matrix.target }}
          path: estamora-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # Creating a release needs write access and verifying a tag does not, so the two are
  # separate jobs. Everything above runs with `contents: read`, which is what makes the
  # verification worth having: a job that could write could also, by mistake, publish
  # something the checks had not passed.
  release:
    name: publish the release
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Collect the archives
        uses: actions/download-artifact@v6
        with:
          pattern: estamora-*
          path: dist
          merge-multiple: true

      # A checksum is what makes the archive installable rather than merely
      # downloadable: `install-binary.sh` refuses a download it cannot verify, and it
      # can only do that because this file is published beside the archives.
      - name: Write the checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 -b *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # Published rather than drafted. A GitHub release is not the immutable artefact
      # here — crates.io is, and `cargo publish` stays a human command for exactly that
      # reason. Pushing an annotated tag is already a deliberate act, the tree it points
      # at has just passed the full suite, and a release that nobody can install from
      # until somebody remembers to press a button is the failure this job exists to
      # remove.
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # `cargo publish` is deliberately not automated.
  #
  # Estamora publishes to crates.io, where a version is immutable and a mistake is
  # permanent. The tag is pushed by a human and the publish is run by a human with a
  # token — which is one command, and the one place in this repository where that is the
  # right trade. Turning it into a workflow would make a permanent external action a
  # consequence of `git push --tags`.
  #
  # When it is time, from a checkout of the tag, in dependency order:
  #
  #   cargo publish -p estamora-core
  #   cargo publish -p estamora-profile
  #   cargo publish -p estamora-vectors
  #   cargo publish -p estamora-soroban
  #   cargo publish -p estamora-assertions
  #   cargo publish -p estamora-report
  #   cargo publish -p estamora-certification
  #
  # `estamora-cli` is absent from that list because it cannot be in it. It takes
  # `estamora-fixture-token` as a normal dependency, since `--contract fixture:<name>` is
  # how the runner demonstrates and self-tests its execution path without a deployed
  # contract, and that fixture is `publish = false`. Packaging rewrites a path dependency
  # into a registry requirement of the same version, so the requirement `estamora-cli`
  # would carry names a version no registry will ever hold: `cargo publish -p
  # estamora-cli` is a command that cannot finish, and it was listed here as though it
  # were merely later in the order. The command arrives as a release binary
  # (`scripts/install-binary.sh`) or through `cargo install --git`, both of which build it
  # from a checkout where the fixture crate is present.
  #
  # The sequence above is the plan and the line below is the decision, in the shape
  # `scripts/check-publish-plan.py` reads. That checker derives the deliverable set from
  # `cargo metadata` and fails when this block disagrees with it — a crate left out, a
  # crate listed that cannot be packaged, an exclusion whose reason has stopped being
  # true, or an order Cargo cannot follow.
  #
  # EXCLUDED estamora-cli: it has a normal dependency on `estamora-fixture-token`, which is `publish = false`
