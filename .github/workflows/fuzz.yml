name: Fuzzing

# The fuzz targets cover the boundaries where untrusted input arrives: a profile, a
# vector, an assertion expression and a report. Each is a document this runner is handed
# by somebody else, and the property being tested is not "it rejects bad input" but "it
# never panics, never allocates without bound, and never reports a fabricated pass".
#
# This is a smoke run, not a campaign: a few minutes per target on every pull request,
# and a longer run nightly. Fuzzing proves nothing about a contract's security, and
# nothing here is offered as such — see `docs/security.md`.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/estamora-profile/**"
      - "crates/estamora-vectors/**"
      - "crates/estamora-report/**"
      - "crates/estamora-core/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "fuzz/**"
  schedule:
    # Nightly, so that a target that only fails after a long exploration gets a chance
    # to, without making every pull request wait for it.
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One per boundary, named as `cargo fuzz run` names them. See `fuzz/README.md`
        # for which input each one covers and why they are in their own workspace.
        target: [profile-fuzzer, vector-fuzzer, assertion-fuzzer, report-fuzzer]
    steps:
      - uses: actions/checkout@v7

      # `cargo-fuzz` builds with the sanitizer that `-Z sanitizer=address` requires, and
      # libFuzzer with coverage instrumentation, both of which need nightly. The pinned
      # stable toolchain still builds and tests the workspace; only this job moves.
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      # `taiki-e/install-action@cargo-fuzz` was the previous spelling, and it installs
      # nothing. That action publishes a tag per tool it supports, and `cargo-fuzz` is not
      # one of them: `manifests/cargo-fuzz.json` does not exist at `v2` and `TOOLS.md` does
      # not list it. The ref that name does resolve to is a *branch*, whose `tool` input is
      # `required: true` with its default left as the unsubstituted
      # `# default: #publish:tool` template. So the step logged "no tool specified",
      # succeeded having installed nothing, and all four matrix legs died on
      # `error: no such command: 'fuzz'` before a single input was tried.
      #
      # `cargo install` is what `fuzz/README.md` already tells a contributor to run, so CI
      # stays on the documented path rather than on a convenience that silently no-ops.
      # `--locked` pins cargo-fuzz's own dependency tree, because a fuzzer that is a
      # different program between two runs is a different experiment.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The failure being fixed was a step that reported success while installing nothing,
      # so presence is asserted here instead of being assumed by the step below — which is
      # minutes away and reports the absence only as `no such command: 'fuzz'`. `fuzz list`
      # additionally proves the four targets are discoverable from this directory.
      - name: Check cargo-fuzz is usable
        run: |
          cargo fuzz --version
          cargo +nightly fuzz list

      - name: Cache the corpus
        uses: actions/cache@v6
        with:
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          key: fuzz-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-${{ matrix.target }}-

      # A time limit rather than an iteration count, because a target that loops is
      # exactly the failure this is looking for and an iteration count would not notice
      # a single slow input.
      - name: Fuzz ${{ matrix.target }}
        run: |
          duration=${{ github.event_name == 'schedule' && 600 || 120 }}
          cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$duration"

      # A crashing input is the artefact, and it is the only thing anybody can act on
      # from a fuzz run. Uploading it on failure rather than on success is the point.
      - name: Upload a crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
