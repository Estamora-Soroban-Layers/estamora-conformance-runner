[package]
name = "estamora-report"
description = "Renders an Estamora conformance run as JSON, Markdown and JUnit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# The JSON document is the report; the other two renderings are conveniences for
# people and for CI, and neither of them is what another tool consumes. That is why
# the model in `model.rs` mirrors the specification's report schema field for field
# rather than the schema being derived from the model: an independent implementation
# must be able to emit a document Estamora tooling accepts.
[dependencies]
estamora-assertions = { workspace = true }
estamora-core = { workspace = true }
estamora-vectors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
quick-xml = { workspace = true }

[dev-dependencies]
jsonschema = { workspace = true }
tempfile = { workspace = true }
