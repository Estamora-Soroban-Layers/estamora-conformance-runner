# cargo-deny configuration.
#
# The dependency tree is part of what a conformance result means: a replacement
# `sha2`, a different `ed25519-dalek`, or a patched `stellar-xdr` changes the tool
# that produced a verdict, and every one of them is a supply-chain decision rather
# than a build detail. This file is where those decisions are recorded.
#
# Run with `cargo deny check` in `fuzz/` or the workspace root.

[graph]
# The workspace has one target-independent dependency graph except for the contract
# fixtures, which are built for WebAssembly. Checking all targets rather than the host
# alone is what keeps a dependency of the fixture contract from going unexamined.
all-features = true

[advisories]
# A vulnerability in a dependency is a vulnerability in the tool whose output people
# gate merges on. There is no version of this check being "advisory" that is honest.
version = 2
yanked = "deny"
ignore = [
    # Add an entry only with a reason and a link, and remove it when the upgrade
    # lands. A bare id with no comment is an exemption nobody can review:
    #
    # { id = "RUSTSEC-0000-0000", reason = "no patched release; the reachable path
    #   needs `x` which this workspace does not enable — see <link>" },

    # `paste` is unmaintained (RUSTSEC-2024-0436), and there is no version of Estamora
    # that avoids it. It arrives through `soroban-env-host 27.0.1` from two choices the
    # SDK makes — `ark-ff 0.5.0` and `wasmi_core 0.13.0` — and `27.0.6` is the newest
    # stable `soroban-sdk`, already pinned here. The releases that drop it are
    # `soroban-sdk 28.0.0-rc.1`, `ark-ff 0.6.0` and `wasmi_core 2.0.0`; taking them means
    # overriding the crypto and WebAssembly dependencies of the SDK the fixture
    # contracts are built with, which would be a worse defect than the one it fixes.
    #
    # This advisory is a maintenance status rather than a defect, and it is the property
    # that makes the entry acceptable where the `quick-xml` advisories were not: `paste`
    # is a proc macro, so it expands at build time, and nothing an untrusted profile,
    # vector or contract contains can reach it at run time. Those advisories were in a
    # library this workspace calls in order to parse untrusted input.
    #
    # Remove this entry when the pinned SDK no longer contains `paste`.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained; transitive through soroban-env-host 27.0.1 via ark-ff 0.5.0 and wasmi_core 0.13.0, with no stable SDK release that avoids it — and it is a build-time proc macro, so nothing untrusted reaches it at run time. See https://rustsec.org/advisories/RUSTSEC-2024-0436" },
]

[licenses]
# The allow list is derived from what is actually in the tree, not from a template.
# Every entry is a licence that permits redistribution under Apache-2.0 terms, so a
# consumer of a published Estamora crate is not surprised by a copyleft dependency.
#
# `LGPL-2.1-or-later` is deliberately absent. It appears only inside a disjunction
# (`MIT OR Apache-2.0 OR LGPL-2.1-or-later`), so the allowed branch is taken and the
# package is fine; listing it here would allow a crate that chose it outright.
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# A crate whose declared licence cannot be resolved from its source text gets a
# `[[licenses.clarify]]` entry here — naming the crate, its expression and where in
# its source the evidence is — rather than a loosened `confidence-threshold`. The
# threshold exists to catch exactly the unresolvable case, and relaxing it globally
# would stop catching it.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A dependency that appears twice at different majors is sometimes unavoidable — the
# SDK's crypto majors are the example in `Cargo.toml` — which is why the default is a
# warning. `deny` is reserved for a wildcard requirement, which is a version that
# nobody has decided.
#
# Every duplicate this produces was checked against the manifests that require it, and
# none is a version this workspace chose:
#
#   * `stellar-strkey` — `soroban-sdk` pins `=0.0.16` while `soroban-env-host` requires
#     `0.0.13`, and a caret requirement on `0.0.x` admits exactly one patch. The two
#     cannot be reconciled, and this workspace's own requirement is `0.0.16`, which is
#     the SDK's rather than a third opinion.
#   * `base64` — `stellar-xdr` and `soroban-spec` require `0.22.1`; the TLS stack behind
#     `reqwest` requires `0.23`. Ours is `0.22.1`, which is the ledger representation's.
#   * `sha2` — every crate that wants it wants `0.10.x`, and the lock holds exactly one.
#
# The rest arrive with the SDK's own crypto and proc-macro dependencies. A duplicate is
# therefore not evidence of drift here; a *new* duplicate that is not in this list would
# be, which is the reading `warn` is meant to invite.

[[bans.deny]]
# The runner must not depend on the CLI, the integration harness, or the fixture
# contract. Each would make a published crate carry something that is not a library:
# the harness is tests, the fixture is a contract to measure, and the CLI is a binary.
#
# The list names no crate that could depend on the harness, and that is the statement:
# nothing does. It is present rather than empty because cargo-deny reads an absent list
# as banning the crate outright, which would fail on the harness being a workspace
# member at all; with a list, the ban applies to every crate that depends on it.
#
# `cargo deny check bans` therefore reports `unused-wrapper` against this entry. That
# warning is the assertion being made rather than a defect in it — it says no crate
# depends on the harness — and it disappears the moment one does, which is the change
# this entry exists to catch. The four crate names that used to be listed here were
# reported the same way, and were wrong for a different reason: each claimed to route
# through the harness and none ever had.
name = "estamora-integration-tests"
wrappers = ["estamora-integration-tests"]

[[bans.deny]]
# Exactly two crates may depend on the fixture contract, and each for a reason rather
# than by convenience. `estamora-cli` depends on it so that `--contract fixture:<name>`
# works at all; `estamora-soroban` depends on it in its test configuration, so that the
# host's behaviour is asserted against a real contract rather than against a mock.
# Neither makes a fixture part of a library's API: the CLI is a binary and the other is
# a dev-dependency. The four names that used to be listed here never depended on it.
name = "estamora-fixture-token"
wrappers = ["estamora-cli", "estamora-soroban"]

[sources]
# Crates come from crates.io. A git dependency would make a published crate
# unbuildable for anyone without access to that repository, and would let the
# dependency's contents change without this repository changing.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
