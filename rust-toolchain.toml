# The toolchain is pinned rather than tracked. A conformance result is only
# meaningful if the tooling that produced it is identified, so the version that
# compiles the runner is part of the runner's identity and appears in every
# report. Updating this file is a change to what a result means, not a
# housekeeping chore.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# Nothing in this workspace is built for WebAssembly: the fixture contracts are
# registered from their Rust types and the runner is a host program. The target is
# pinned anyway, so that measuring your own contract — the case
# `docs/local-testing.md` and `examples/local-contract/` walk through — does not
# start with adding a target and working out which one is current.
targets = ["wasm32v1-none"]
profile = "minimal"
