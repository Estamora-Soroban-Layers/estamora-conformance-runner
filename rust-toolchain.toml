# The toolchain is pinned rather than tracked. A conformance result is only
# meaningful if the tooling that produced it is identified, so the version that
# compiles the runner is part of the runner's identity and appears in every
# report. Updating this file is a change to what a result means, not a
# housekeeping chore.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# The runner's own crates are host programs and its fixture contracts are registered
# from their Rust types, so nothing in *this* workspace is built for WebAssembly. Two
# things are: `fixtures/contracts/measurable-token`, which declares its own workspace so
# that it can be, and the contract a reader brings to `docs/local-testing.md`. Both are
# built for this target, which is why it is pinned — measuring your own contract should
# not start with adding a target and working out which one is current.
targets = ["wasm32v1-none"]
profile = "minimal"
